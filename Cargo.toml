[package]
name = "memonbooks"
version = "0.1.0"
edition = "2021"
description = "MemonBooks -- a double-entry accounting / ERP desktop application."
license = "UNLICENSED"
publish = false

[dependencies]
iced = "0.13"
rust_decimal = "1"
rust_decimal_macros = "1"
thiserror = "2"
log = "0.4"
simplelog = "0.12"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = "0.4"
argon2 = "0.5"
totp-rs = { version = "5", features = ["gen_secret"] }
rand = "0.8"
