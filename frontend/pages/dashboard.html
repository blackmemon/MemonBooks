<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — MemonBook ERP</title>

  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/sidebar.css">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- Sidebar overlay (mobile) -->
<div id="sidebar-overlay" class="sidebar-overlay"></div>

<div id="app">
  <div class="app-body">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar"></aside>

    <!-- Main content -->
    <div class="main-content">

      <!-- Top header -->
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <nav class="header-breadcrumb" id="breadcrumb">
            <span class="breadcrumb-current">Dashboard</span>
          </nav>
        </div>
        <div class="header-right">
          <div class="company-chip" id="company-chip">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
            <span id="company-name">MemonBook ERP</span>
          </div>
          <button class="notif-btn" title="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            <span class="notif-dot"></span>
          </button>
        </div>
      </header>

      <!-- Page content (router renders here) -->
      <main class="page-container" id="page-content">
        <!-- Dashboard renders here -->
        <div style="display:flex;align-items:center;justify-content:center;height:300px">
          <div class="spinner"></div>
        </div>
      </main>

    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container" class="toast-container"></div>

<script type="module" src="../assets/js/core/app.js"></script>

</body>
</html>
