# Flatpak manifest (Section 7). No business logic lives here or
# anywhere under packaging/ -- this only describes how to build and
# sandbox the already-written Rust application.
#
# Build steps (not runnable here -- no flatpak-builder / Flatpak
# runtimes were available in this Windows environment to actually
# produce a .flatpak; this manifest is written to the real schema and
# ready for someone on Linux with flatpak-builder installed):
#   flatpak install flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08
#   flatpak install flathub org.freedesktop.Sdk.Extension.rust-stable//23.08
#   flatpak-builder --user --install build-dir com.memonbooks.MemonBooks.yml

app-id: com.memonbooks.MemonBooks
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: memonbooks

finish-args:
  # A desktop window (Wayland preferred, X11 fallback) and GPU access
  # for Iced's wgpu renderer -- nothing beyond that: no network,
  # no host filesystem, no microphone/camera/device access.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The app's own SQLite database and logs live under the Flatpak
  # sandbox's private data directory, which needs no extra permission
  # (XDG_DATA_HOME is granted by default).

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/memonbooks/cargo

modules:
  - name: memonbooks
    buildsystem: simple
    build-commands:
      # --bin memonbooks explicitly, not a bare `cargo build --release`
      # -- the crate also has seed_demo_data and clear_demo_data admin
      # binaries under src/bin/ (for manual testing only, never run as
      # part of normal app startup), which must never ship in the
      # Flatpak. This is the one and only binary this manifest builds,
      # names, or installs.
      - cargo build --release --offline --bin memonbooks || cargo build --release --bin memonbooks
      - install -Dm755 target/release/memonbooks /app/bin/memonbooks
      - install -Dm644 packaging/linux/flatpak/com.memonbooks.MemonBooks.desktop
          /app/share/applications/com.memonbooks.MemonBooks.desktop
      - install -Dm644 packaging/linux/flatpak/com.memonbooks.MemonBooks.metainfo.xml
          /app/share/metainfo/com.memonbooks.MemonBooks.metainfo.xml
      # icon.svg and the hicolor PNG set are a simple placeholder (see
      # the comment in icon.svg) -- swap for real designed artwork
      # before a public release.
      - install -Dm644 packaging/linux/icon.svg
          /app/share/icons/hicolor/scalable/apps/com.memonbooks.MemonBooks.svg
      - install -Dm644 packaging/linux/icons/hicolor/16x16/apps/com.memonbooks.MemonBooks.png
          /app/share/icons/hicolor/16x16/apps/com.memonbooks.MemonBooks.png
      - install -Dm644 packaging/linux/icons/hicolor/32x32/apps/com.memonbooks.MemonBooks.png
          /app/share/icons/hicolor/32x32/apps/com.memonbooks.MemonBooks.png
      - install -Dm644 packaging/linux/icons/hicolor/48x48/apps/com.memonbooks.MemonBooks.png
          /app/share/icons/hicolor/48x48/apps/com.memonbooks.MemonBooks.png
      - install -Dm644 packaging/linux/icons/hicolor/64x64/apps/com.memonbooks.MemonBooks.png
          /app/share/icons/hicolor/64x64/apps/com.memonbooks.MemonBooks.png
      - install -Dm644 packaging/linux/icons/hicolor/128x128/apps/com.memonbooks.MemonBooks.png
          /app/share/icons/hicolor/128x128/apps/com.memonbooks.MemonBooks.png
      - install -Dm644 packaging/linux/icons/hicolor/256x256/apps/com.memonbooks.MemonBooks.png
          /app/share/icons/hicolor/256x256/apps/com.memonbooks.MemonBooks.png
      - install -Dm644 packaging/linux/icons/hicolor/512x512/apps/com.memonbooks.MemonBooks.png
          /app/share/icons/hicolor/512x512/apps/com.memonbooks.MemonBooks.png
    sources:
      - type: dir
        path: ../../..
