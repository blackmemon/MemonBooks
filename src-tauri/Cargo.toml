[package]
name = "memonbook-erp"
version = "1.0.0"
description = "MemonBook ERP — Offline Accounting & HR System"
authors = ["Memon Enterprises"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "memonbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri        = { version = "2.1",  features = ["protocol-asset"] }
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
reqwest      = { version = "0.12", features = ["json"], default-features = false }
sha2         = "0.10"

# Tauri plugins
tauri-plugin-shell        = "2"
tauri-plugin-dialog       = "2"
tauri-plugin-fs           = "2"
tauri-plugin-http         = "2"
tauri-plugin-notification = "2"
tauri-plugin-os           = "2"

# iOS only
[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"

[features]
default         = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
